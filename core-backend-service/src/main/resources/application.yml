server:
  port: 8085

spring:
  application:
    name: core-backend-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Valida contra nuestro init_logistics.sql sin alterarlo
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuración del cliente HTTP para consumir el Agente de IA en Python
ai-agent:
  base-url: ${AI_AGENT_BASE_URL:http://localhost:8000}

# Swagger UI en /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html