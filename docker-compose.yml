services:
  logistics-db:
    image: postgres:16-alpine
    container_name: logistics-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistics_db
    ports:
      - "5432:5432"
    volumes:
      - logistics_pgdata:/var/lib/postgresql/data
      - ./init_logistics.sql:/docker-entrypoint-initdb.d/init_logistics.sql
    restart: unless-stopped
    networks:
      - logistics-network
  ai-agent-service:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: logistics-ai-agent
    ports:
      - "8000:8000"
    env_file:
      - ./ai-agent-service/.env
    environment:
      # Sobrescribimos localhost por el nombre del contenedor de postgres en la red de Docker
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@logistics-db:5432/logistics_db
    depends_on:
      - logistics-db
    restart: unless-stopped
    networks:
      - logistics-network

# 3. Core Backend de Negocio (Java 21 Spring Boot)
  core-backend-service:
    build:
      context: ./core-backend-service
      dockerfile: Dockerfile
    container_name: logistics-core-backend
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://logistics-db:5432/logistics_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - AI_AGENT_BASE_URL=http://ai-agent-service:8000
    depends_on:
      - logistics-db
      - ai-agent-service
    restart: unless-stopped
    networks:
      - logistics-network

        # 4. Frontend Web (Angular 19 + Nginx)
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: logistics-frontend
    ports:
      - "4200:80"
    depends_on:
      - core-backend-service
    restart: unless-stopped
    networks:
      - logistics-network

volumes:
  logistics_pgdata:
networks:
  logistics-network:
    driver: bridge